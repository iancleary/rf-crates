name: Publish RF crate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing crate-qualified GitHub release tag
        required: true
        type: string
      expected_commit:
        description: Exact 40-character source commit; the public tag must not move
        required: true
        type: string
      publish:
        description: Publish after verification (false performs a recovery dry-run)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rf-crates-publication
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.repository == 'iancleary/rf-crates' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin an existing stable release to its expected main-branch commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(rfconversions|touchstone|gainlineup|linkbudget)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Select an existing stable release for one approved crate." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "An exact 40-character expected commit is required." >&2
            exit 1
          fi
          source_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$source_commit" = "$EXPECTED_COMMIT"
          git merge-base --is-ancestor "$source_commit" origin/main
          gh release view "$RELEASE_TAG" --repo iancleary/rf-crates \
            --json tagName,isDraft,isPrerelease |
            jq -e --arg tag "$RELEASE_TAG" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == false'
          printf 'source_commit=%s\ntag=%s\n' "$source_commit" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_commit }}

  publish:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Isolate publication artifacts
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/rf-crate-publication" >> "$GITHUB_ENV"
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Validate crate, tag, main ancestry, notes, and registry dependencies
        id: release
        run: uv run --offline --no-project scripts/release_policy.py preflight --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Verify the selected package against real registry dependencies
        env:
          PACKAGE: ${{ steps.release.outputs.crate }}
        run: cargo publish --dry-run --locked -p "$PACKAGE"
      - name: Publish the selected crate
        if: github.event_name == 'release' || inputs.publish
        env:
          PACKAGE: ${{ steps.release.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured for this publication job." >&2
            exit 1
          fi
          cargo publish --locked -p "$PACKAGE"
      - name: Wait for the published archive checksum in the crates.io index
        if: github.event_name == 'release' || inputs.publish
        env:
          PACKAGE: ${{ steps.release.outputs.crate }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mapfile -d '' -t archives < <(
            find "$CARGO_TARGET_DIR/package" -type f -name "$PACKAGE-$VERSION.crate" -print0
          )
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected one archive in the isolated publication target; found ${#archives[@]}." >&2
            exit 1
          fi
          uv run --offline --no-project scripts/release_policy.py \
            wait-index "$PACKAGE" "$VERSION" --timeout 600 \
            --archive "${archives[0]}"
