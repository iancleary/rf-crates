name: RF workspace verification

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rf-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Fetch locked build dependencies
        run: cargo fetch --locked
      - name: Verify workspace membership and dependency resolution
        run: uv run --offline --no-project scripts/verify_workspace.py
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run all-feature tests
        run: cargo test --workspace --all-features --locked
      - name: Run library-only tests
        run: cargo test --workspace --no-default-features --locked
      - name: Verify independent numerical references
        working-directory: crates/rfconversions
        run: uv run --offline --no-project .agents/skills/rf-literature-review/scripts/verify_numerics.py
      - name: Check documentation
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify package artifacts
        run: cargo package --workspace --locked
      - name: Build release artifacts
        run: cargo build --workspace --release --all-features --locked
