[release]
name = "linkbudget"
version_source = "crates/linkbudget/Cargo.toml"
runner_protocol = "prepared-v1"
runner = ["uv", "run", "--offline", "--no-project", "scripts/release.py", "tag-release", "--provider", "github", "--tag-prefix", "linkbudget-v", "--branch", "main", "--notes-required", "--not-latest"]
dry_run_args = ["--dry-run"]
current_version_command = ["uv", "run", "--offline", "--no-project", "scripts/release.py", "cargo-current-version", "--version-source", "crates/linkbudget/Cargo.toml"]
validate_version_command = ["uv", "run", "--offline", "--no-project", "scripts/release_policy.py", "validate", "linkbudget"]
notes_file = "release/notes/linkbudget.md"
publish = true

[checks]
commands = [
  ["uv", "run", "--offline", "--no-project", "scripts/release_policy.py", "check-workflows"],
  ["just", "ci"],
  ["cargo", "publish", "--dry-run", "--locked", "-p", "linkbudget"],
]

[runner_source]
repository = "https://github.com/iancleary/release-skills"
revision = "d24a23c89279b2676f6bf3f9145c4d59147c5a6f"
sha256 = "10869f02fe8a1190e75cc3e70eef85012e89dba52b89d865f79a6a9fb317139e"
